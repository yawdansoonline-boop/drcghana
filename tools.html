<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools & Templates — DRCGHANA</title>
<link rel="icon" type="image/png" href="/logo_circle.png">
<meta name="description" content="Practical tools and templates for engineers, contractors, masons and builders in Ghana — block calculators, BOQ templates and more.">
<script src="https://js.paystack.co/v1/inline.js" async="false"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A030; --gold-light: #E8C96A;
    --green: #1B6B35; --green-light: #2A8A4A; --green-dim: #14522A;
    --dark: #0A0E0B; --dark-2: #121710; --dark-3: #181E14; --dark-4: #222B1C;
    --mid: #344028; --text-dim: #7A8A74; --text-mid: #A8B89E; --text-light: #E0ECD8; --white: #F2F7EE;
    --accent-red: #C44B2B; --radius: 2px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--dark); color: var(--text-light); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  button { cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; background: none; }

  nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 4rem; height: 76px; background: rgba(10,14,11,0.97); backdrop-filter: blur(16px); border-bottom: 0.5px solid rgba(27,107,53,0.3); }
  .nav-logo-wrap { display: flex; align-items: center; gap: 12px; }
  .nav-logo-img { height: 48px; width: 48px; border-radius: 50%; object-fit: cover; }
  .nav-logo-text { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
  .back-link { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-mid); border: 0.5px solid rgba(201,160,48,0.35); padding: 9px 20px; border-radius: var(--radius); transition: all 0.2s; }
  .back-link:hover { color: var(--gold); border-color: var(--gold); }
  .cart-btn { display: flex; align-items: center; gap: 8px; padding: 9px 22px; border: 0.5px solid var(--gold); color: var(--gold); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; transition: all 0.2s; border-radius: var(--radius); margin-left: 12px; }
  .cart-btn:hover { background: var(--gold); color: var(--dark); }
  .cart-count { background: var(--gold); color: var(--dark); border-radius: 50%; width: 18px; height: 18px; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
  .nav-right { display: flex; align-items: center; }

  .page-hero { padding: 4.5rem 4rem 3rem; text-align: center; border-bottom: 0.5px solid rgba(201,160,48,0.15); }
  .page-eyebrow { font-size: 11px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--green-light); margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .page-eyebrow::before, .page-eyebrow::after { content: ''; width: 32px; height: 1px; background: var(--green-light); }
  .page-hero h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 52px); font-weight: 300; color: var(--white); line-height: 1.1; margin-bottom: 1rem; }
  .page-hero h1 em { font-style: italic; color: var(--gold-light); }
  .page-hero p { color: var(--text-mid); max-width: 560px; margin: 0 auto; font-size: 15px; }

  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; padding: 3rem 4rem 5rem; }
  .product-card { background: var(--dark-2); border: 0.5px solid var(--dark-4); border-radius: var(--radius); overflow: hidden; transition: border-color 0.3s, transform 0.3s; }
  .product-card:hover { border-color: rgba(27,107,53,0.5); transform: translateY(-3px); }
  .product-img { position: relative; aspect-ratio: 4/3; overflow: hidden; background: var(--dark-3); }
  .product-img img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7) saturate(0.75); }
  .product-badge { position: absolute; top: 12px; left: 12px; background: var(--gold); color: var(--dark); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; padding: 4px 10px; font-weight: 500; }
  .product-badge.new { background: var(--green); color: var(--white); }
  .product-body { padding: 1.25rem 1.25rem 1.5rem; }
  .product-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--white); margin-bottom: 0.5rem; line-height: 1.2; }
  .product-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 1rem; line-height: 1.6; }
  .product-includes { list-style: none; margin: 0 0 1rem; padding: 0; }
  .product-includes li { font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .product-includes li::before { content: '✔'; color: var(--green-light); font-size: 10px; flex-shrink: 0; }
  .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; }
  .product-price { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; color: var(--gold-light); background: rgba(201,160,48,0.12); padding: 4px 12px; border-radius: var(--radius); }
  .add-to-cart { padding: 8px 18px; border: 0.5px solid rgba(27,107,53,0.5); color: var(--green-light); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border-radius: var(--radius); transition: all 0.2s; }
  .add-to-cart:hover { background: var(--green); color: var(--white); border-color: var(--green); }
  .empty-state { text-align: center; padding: 4rem; color: var(--text-dim); grid-column: 1/-1; }

  /* CART (identical pattern to main store) */
  .cart-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6); }
  .cart-overlay.open { display: block; }
  .cart-drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 201; width: 420px; background: var(--dark-2); border-left: 0.5px solid var(--dark-4); transform: translateX(100%); transition: transform 0.35s ease; display: flex; flex-direction: column; }
  .cart-drawer.open { transform: translateX(0); }
  .cart-header { padding: 1.5rem 1.75rem; border-bottom: 0.5px solid var(--dark-4); display: flex; align-items: center; justify-content: space-between; }
  .cart-header h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--white); }
  .close-cart { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 20px; }
  .close-cart:hover { color: var(--white); }
  .cart-items { flex: 1; overflow-y: auto; padding: 1.5rem 1.75rem; }
  .cart-empty { text-align: center; padding: 4rem 1rem; }
  .cart-empty p { color: var(--text-dim); font-size: 14px; margin-top: 0.5rem; }
  .cart-empty .icon { font-size: 40px; }
  .cart-item { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 0.5px solid var(--dark-4); align-items: flex-start; }
  .cart-item img { width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius); flex-shrink: 0; }
  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 14px; color: var(--white); margin-bottom: 2px; }
  .cart-item-price { font-size: 13px; color: var(--gold); }
  .cart-item-remove { font-size: 18px; color: var(--text-dim); padding: 0 4px; }
  .cart-item-remove:hover { color: var(--accent-red); }
  .cart-footer { padding: 1.5rem 1.75rem; border-top: 0.5px solid var(--dark-4); }
  .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
  .cart-total .label { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); }
  .cart-total .amount { font-family: 'Cormorant Garamond', serif; font-size: 26px; color: var(--gold-light); }
  .checkout-btn { width: 100%; padding: 14px; background: var(--green); color: var(--white); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; border-radius: var(--radius); transition: background 0.2s; }
  .checkout-btn:hover { background: var(--green-light); }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--dark-3); border: 0.5px solid var(--green-light); color: var(--white); padding: 12px 24px; border-radius: var(--radius); font-size: 13px; z-index: 300; transition: transform 0.35s ease; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  footer { text-align: center; padding: 2.5rem; color: var(--text-dim); font-size: 12px; border-top: 0.5px solid rgba(27,107,53,0.15); }

  @media (max-width: 768px) {
    nav { padding: 0 1.25rem; }
    .page-hero { padding: 3rem 1.25rem 2.5rem; }
    .products-grid { padding: 2rem 1.25rem 3rem; grid-template-columns: 1fr; }
    .cart-drawer { width: 100%; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo-wrap">
    <img src="/logo_circle.png" alt="DRCGHANA Logo" class="nav-logo-img">
    <div class="nav-logo-text">DRCGHANA</div>
  </div>
  <div class="nav-right">
    <a href="/" class="back-link">← Back to Store</a>
    <button class="cart-btn" onclick="openCart()">Cart <span class="cart-count" id="cartCount">0</span></button>
  </div>
</nav>

<section class="page-hero">
  <p class="page-eyebrow">Tools &amp; Templates</p>
  <h1>Practical <em>Tools for the Job Site</em></h1>
  <p>Calculators, templates and reference tools built for engineers, contractors, masons and anyone managing their own build.</p>
</section>

<div class="products-grid" id="productsGrid">
  <div class="empty-state">Loading tools…</div>
</div>

<footer>© 2026 DRCGHANA. All rights reserved.</footer>

<!-- CART -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header"><h3>Your Cart</h3><button class="close-cart" onclick="closeCart()">✕</button></div>
  <div class="cart-items" id="cartItems"><div class="cart-empty"><div class="icon">🛒</div><p>Your cart is empty</p></div></div>
  <div class="cart-footer" id="cartFooter" style="display:none;">
    <div class="cart-total"><span class="label">Total</span><span class="amount" id="cartTotal">GH₵ 0</span></div>
    <input type="email" id="customerEmail" placeholder="Enter your email to receive download links"
    style="width:100%;padding:11px 14px;background:var(--dark-4);border:0.5px solid var(--mid);color:var(--white);font-size:13px;font-family:DM Sans,sans-serif;border-radius:var(--radius);outline:none;margin-bottom:10px;" />
    <button class="checkout-btn" onclick="initiatePayment()">Proceed to Checkout →</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let products = [];
let cart = [];

async function loadProducts() {
  try {
    const res = await fetch('/products.json');
    if (!res.ok) throw new Error('Failed to load');
    const all = await res.json();
    products = all.filter(p => p.category === 'tools');
    renderProducts();
  } catch (err) {
    document.getElementById('productsGrid').innerHTML = '<div class="empty-state">Could not load tools right now. Please refresh, or contact us if this keeps happening.</div>';
  }
}

function renderProducts() {
  const g = document.getElementById('productsGrid');
  if (products.length === 0) {
    g.innerHTML = '<div class="empty-state">No tools available yet — check back soon.</div>';
    return;
  }
  g.innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-img"><img src="${p.img}" alt="${p.name}" loading="lazy">${p.badge ? `<div class="product-badge ${p.badge==='New'?'new':''}">${p.badge}</div>` : ''}</div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.desc}</div>
        ${p.includes && p.includes.length ? `<ul class="product-includes">${p.includes.map(i=>`<li>${i}</li>`).join('')}</ul>` : ''}
        <div class="product-footer">
          <div class="product-price">GH₵${p.price.toLocaleString()}</div>
          <button class="add-to-cart" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
      </div>
    </div>
  `).join('');
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p) { showToast('Product not found'); return; }
  if (cart.find(i => i.id === p.id)) { showToast('Already in cart'); return; }
  cart.push(p);
  updateCartUI();
  showToast('✓ "' + p.name + '" added to cart');
  openCart();
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  updateCartUI();
}

function updateCartUI() {
  document.getElementById('cartCount').textContent = cart.length;
  const t = cart.reduce((s,i) => s + i.price, 0);
  document.getElementById('cartTotal').textContent = 'GH₵ ' + t.toLocaleString();
  const ie = document.getElementById('cartItems');
  const fe = document.getElementById('cartFooter');
  if (cart.length === 0) {
    ie.innerHTML = '<div class="cart-empty"><div class="icon">🛒</div><p>Your cart is empty</p></div>';
    fe.style.display = 'none';
  } else {
    fe.style.display = 'block';
    ie.innerHTML = cart.map(i => `
      <div class="cart-item">
        <img src="${i.img}" alt="${i.name}">
        <div class="cart-item-info">
          <div class="cart-item-name">${i.name}</div>
          <div class="cart-item-price">GH₵ ${i.price.toLocaleString()}</div>
        </div>
        <button class="cart-item-remove" onclick="removeFromCart(${i.id})">✕</button>
      </div>
    `).join('');
  }
}

function openCart() { document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartDrawer').classList.add('open'); }
function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartDrawer').classList.remove('open'); }
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2800); }

loadProducts();

function initiatePayment() {
  const email = document.getElementById('customerEmail').value.trim();
  if (!email || !email.includes('@')) { showToast('Please enter your email address first'); document.getElementById('customerEmail').focus(); return; }
  if (cart.length === 0) { showToast('Your cart is empty'); return; }

  const total = cart.reduce((s,i) => s + i.price, 0);
  const cartSummary = cart.map(i => i.name).join('|');
  const ref = 'DRCGHANA_' + Math.floor(Math.random() * 1000000000 + 1);

  const handler = PaystackPop.setup({
    key: 'pk_live_6b7bfe4e7f8d152c1cac558ddb2012ebc73fa63d',
    email: email,
    amount: total * 100,
    currency: 'GHS',
    ref: ref,
    channels: ['card', 'mobile_money', 'ussd', 'bank'],
    metadata: {
      custom_fields: [
        { display_name: 'Products', variable_name: 'products', value: cartSummary },
        { display_name: 'Customer Email', variable_name: 'customer_email', value: email }
      ]
    },
    callback: function(response) {
      window.location.href = '/download.html?ref=' + response.reference + '&email=' + encodeURIComponent(email) + '&items=' + encodeURIComponent(cartSummary);
    },
    onClose: function() {
      showToast('Payment window closed. Your cart is still saved.');
    }
  });
  handler.openIframe();
}
</script>
</body>
</html>
